<!--
  文字 AI 节点编辑器模板。
  本文件同时定义共享的 window.momoNr（编辑器侧工具：拉取 momo-ctx、直传 /api/oss/upload），
  供本包其它节点模板复用（加载顺序由 package.json nodes map 决定，本节点最先加载）。
-->
<script type="text/javascript">
  window.momoNr = {
    _ctx: null,
    /** 实例上下文：{ token, imageModels, textModels }。
     *  必须走 jQuery $.ajax —— 编辑器用 $.ajaxSetup 给相对路径自动加
     *  Authorization（bare fetch 不带鉴权头会 401）。 */
    getCtx() {
      if (this._ctx) return Promise.resolve(this._ctx)
      return new Promise((resolve, reject) => {
        $.ajax({ url: 'momo-ctx', dataType: 'json', cache: false })
          .done((data) => {
            this._ctx = data
            resolve(data)
          })
          .fail((jqXHR) => {
            reject(
              new Error(
                (jqXHR.responseJSON && jqXHR.responseJSON.error) || 'HTTP ' + jqXHR.status
              )
            )
          })
      })
    },
    /** 浏览器直传主进程 /api/oss/upload（绝对路径不走编辑器 ajaxSetup，需显式取 token） */
    async uploadImage(file) {
      const ctx = await this.getCtx()
      const authTokens = RED.settings.get('auth-tokens') || {}
      const token = authTokens.access_token || ctx.token
      const fd = new FormData()
      fd.append('file', file)
      fd.append('scope', 'inputs')
      const r = await fetch('/api/oss/upload', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token },
        body: fd,
      })
      const j = await r.json().catch(() => null)
      if (!r.ok || !j || j.success === false) {
        throw new Error((j && j.error) || '上传失败 (' + r.status + ')')
      }
      return { url: j.data.publicUrl, fileName: file.name }
    },
  }

  RED.nodes.registerType('momo-text-ai', {
    category: 'Momo AI',
    color: '#722ed1',
    defaults: {
      name: { value: '' },
      channelModelId: { value: '' },
      taskPrompt: { value: '' },
      detailPrompt: { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'template.svg',
    paletteLabel: '文字 AI',
    label: function () {
      return this.name || '文字 AI'
    },
    oneditprepare: function () {
      const sel = $('#node-input-channelModelId')
      const current = String(this.channelModelId || '')
      sel.append($('<option></option>').val('').text('（默认文字模型）'))
      momoNr
        .getCtx()
        .then((ctx) => {
          for (const m of ctx.textModels) {
            sel.append(
              $('<option></option>')
                .val(String(m.id))
                .text(m.displayName + ' · ' + m.providerName)
            )
          }
          sel.val(current)
        })
        .catch((err) => {
          sel.append($('<option></option>').text('模型目录加载失败: ' + err.message))
        })
    },
  })
</script>

<script type="text/html" data-template-name="momo-text-ai">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> 名称</label>
    <input type="text" id="node-input-name" placeholder="文字 AI" />
  </div>
  <div class="form-row">
    <label for="node-input-channelModelId"><i class="fa fa-cogs"></i> 模型</label>
    <select id="node-input-channelModelId"></select>
  </div>
  <div class="form-row">
    <label for="node-input-taskPrompt"><i class="fa fa-tasks"></i> 任务提示词</label>
    <textarea id="node-input-taskPrompt" rows="3" placeholder="例如：为这张商品图写一条小红书文案"></textarea>
  </div>
  <div class="form-row">
    <label for="node-input-detailPrompt"><i class="fa fa-list"></i> 补充要求</label>
    <textarea id="node-input-detailPrompt" rows="3" placeholder="风格/字数/语气等要求（可空）"></textarea>
  </div>
  <div class="form-tips">
    上游 msg.payload 作为「上游文本」拼接进提示词；接入图片输入节点的图会作为参考图（多模态）发给模型。输出：msg.payload = 文本。
  </div>
</script>

<script type="text/html" data-help-name="momo-text-ai">
  <p>调用平台文字模型生成文案/提示词，不消耗积分。</p>
  <h3>输入</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">string</span></dt>
    <dd>上游文本，拼接为「Upstream text」段。</dd>
    <dt>image / images <span class="property-type">object</span></dt>
    <dd>参考图（图片输入节点输出），以多模态方式发给模型。</dd>
  </dl>
  <h3>输出</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">string</span></dt>
    <dd>模型返回的文本。</dd>
  </dl>
</script>
