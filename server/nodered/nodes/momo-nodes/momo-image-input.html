<script type="text/javascript">
  RED.nodes.registerType('momo-image-input', {
    category: 'Momo AI',
    color: '#13a9c9',
    defaults: {
      name: { value: '' },
      imageUrl: { value: '' },
      fileName: { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'arrow-in.svg',
    paletteLabel: '图片输入',
    label: function () {
      return this.name || this.fileName || '图片输入'
    },
    oneditprepare: function () {
      const node = this
      const $btn = $('#node-input-upload-btn')
      const $file = $('#node-input-file')
      const $img = $('#node-input-preview')
      const $name = $('#node-input-file-name')

      function refreshPreview(url, fileName) {
        if (url) {
          $img.attr('src', url).show()
        } else {
          $img.hide()
        }
        $name.text(fileName || (url ? '已上传' : '未上传'))
      }
      refreshPreview(node.imageUrl, node.fileName)

      $btn.on('click', function () {
        $file.trigger('click')
      })
      $file.on('change', async function () {
        const file = this.files && this.files[0]
        if (!file) return
        $btn.text('上传中…').prop('disabled', true)
        try {
          const uploaded = await momoNr.uploadImage(file)
          node.imageUrl = uploaded.url
          node.fileName = uploaded.fileName
          refreshPreview(uploaded.url, uploaded.fileName)
        } catch (err) {
          RED.notify('图片上传失败: ' + err.message, 'error')
        } finally {
          $btn.text('重新上传').prop('disabled', false)
        }
      })
    },
    oneditsave: function () {
      // imageUrl/fileName 由上传回调写入 this（oneditprepare 的 node 即编辑上下文）
      this.imageUrl = this.imageUrl || ''
      this.fileName = this.fileName || ''
    },
  })
</script>

<script type="text/html" data-template-name="momo-image-input">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> 名称</label>
    <input type="text" id="node-input-name" placeholder="图片输入" />
  </div>
  <div class="form-row">
    <label style="width: auto"><i class="fa fa-picture-o"></i> 图片</label>
    <button class="red-ui-button" type="button" id="node-input-upload-btn">上传</button>
    <input type="file" id="node-input-file" accept="image/*" style="display: none" />
    <span id="node-input-file-name" style="margin-left: 8px"></span>
  </div>
  <div class="form-row">
    <img id="node-input-preview" style="max-height: 120px; max-width: 100%; display: none" />
  </div>
  <div class="form-tips">
    触发（手动/上游注入）后输出 msg.image = { url, fileName } 与 msg.images 数组，供文字 AI 做多模态参考图；msg.payload 原样传递。
  </div>
</script>

<script type="text/html" data-help-name="momo-image-input">
  <p>上传一张图片作为流程的图片源。</p>
  <h3>输出</h3>
  <dl class="message-properties">
    <dt>image <span class="property-type">object</span></dt>
    <dd>{ url, fileName }。</dd>
    <dt>images <span class="property-type">array</span></dt>
    <dd>[ image ] 单元素数组。</dd>
  </dl>
</script>
